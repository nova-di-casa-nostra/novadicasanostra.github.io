    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2d58c"/><stop offset="1" stop-color="#c85b62"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
